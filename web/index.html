<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOPSBOT WebViz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css?v=6" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">TOPSBOT</span>
      <span class="brand-sep">|</span>
      <span class="brand-sub">WebViz</span>
    </div>
    <div class="header-status">
      <span class="status-dot" id="statusDot"></span>
      <span>在线 <strong id="onlineCount">0</strong>/<span id="totalChannels">4</span> 路</span>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" title="显示" aria-label="显示">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      </button>
      <button type="button" class="icon-btn" title="通知" aria-label="通知">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
      </button>
      <button type="button" class="icon-btn" title="帮助" aria-label="帮助">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
      </button>
      <div class="user-chip">
        <span class="user-avatar">A</span>
        <span>admin</span>
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
      </div>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar card">
      <div class="sidebar-head">
        <h2>摄像头列表</h2>
        <div class="view-toggle">
          <button type="button" class="view-btn active" title="网格视图" aria-label="网格视图">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
          </button>
          <button type="button" class="view-btn" title="列表视图" aria-label="列表视图">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
          </button>
        </div>
      </div>
      <ul id="channelList" class="channel-list"></ul>
      <button type="button" class="link-btn" id="btnSelectAll">全选</button>
    </aside>

    <div class="main-column">
      <section class="grid-wrap card">
        <div id="videoGrid" class="video-grid grid-2x2"></div>
      </section>

      <footer class="bottom-bar card">
        <div class="layout-group">
          <span class="bar-label">布局</span>
          <div class="layout-btns" id="layoutBtns">
            <button type="button" class="layout-btn" data-layout="1" title="1 路">1</button>
            <button type="button" class="layout-btn active" data-layout="4" title="2×2">4</button>
            <button type="button" class="layout-btn" data-layout="9" title="3×3">9</button>
            <button type="button" class="layout-btn" data-layout="16" title="4×4">16</button>
          </div>
        </div>
        <div class="action-group">
          <button type="button" class="action-btn" id="btnFullscreen">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            全屏
          </button>
          <button type="button" class="action-btn" id="btnSnapshot">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            抓图
          </button>
          <button type="button" class="action-btn" id="btnSettings">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            设置
          </button>
        </div>
        <div class="conn-hint" id="statusText">连接中…</div>
      </footer>
    </div>

    <aside class="panel card">
      <section class="panel-section">
        <h2>AI 叠加设置</h2>
        <ul class="toggle-list">
          <li>
            <span>检测框</span>
            <label class="switch"><input type="checkbox" id="layerBoxes" checked /><span class="slider"></span></label>
          </li>
          <li>
            <span>关键点</span>
            <label class="switch"><input type="checkbox" id="layerKeypoints" checked /><span class="slider"></span></label>
          </li>
          <li>
            <span>分割</span>
            <label class="switch"><input type="checkbox" id="layerSegment" disabled /><span class="slider"></span></label>
          </li>
          <li>
            <span>TrackID</span>
            <label class="switch"><input type="checkbox" id="layerTrackId" /><span class="slider"></span></label>
          </li>
          <li>
            <span>置信度</span>
            <label class="switch"><input type="checkbox" id="layerLabels" checked /><span class="slider"></span></label>
          </li>
        </ul>
      </section>

      <section class="panel-section">
        <h2>全局性能</h2>
        <div class="metric-cards">
          <div class="metric-card">
            <div class="metric-icon metric-icon-fps">⚡</div>
            <div class="metric-body">
              <div class="metric-label">FPS（平均）</div>
              <div class="metric-value"><span id="statFps">-</span> <small>FPS</small></div>
            </div>
          </div>
          <div class="metric-card">
            <div class="metric-icon metric-icon-lat">⏱</div>
            <div class="metric-body">
              <div class="metric-label">延迟（平均）</div>
              <div class="metric-value"><span id="statLatency">-</span> <small>ms</small></div>
            </div>
          </div>
          <div class="metric-card metric-card-wide">
            <div class="metric-icon metric-icon-cpu">◉</div>
            <div class="metric-body">
              <div class="metric-label">设备负载</div>
              <div class="metric-value"><span id="statLoad">-</span></div>
              <div class="progress"><div class="progress-bar" id="barLoad" style="width:0%"></div></div>
            </div>
          </div>
          <div class="metric-card metric-card-wide">
            <div class="metric-icon metric-icon-mem">▣</div>
            <div class="metric-body">
              <div class="metric-label">内存使用</div>
              <div class="metric-value" id="statMemory">-</div>
              <div class="progress"><div class="progress-bar" id="barMem" style="width:0%"></div></div>
            </div>
          </div>
        </div>
        <div class="metric-foot">分辨率: <span id="statResolution">-</span></div>
      </section>
    </aside>
  </div>

  <script src="utils/protobuf.js?v=7"></script>
  <script src="utils/reconnecting-websocket.js?v=7"></script>
  <script src="js/runtime_config.js?v=7"></script>
  <script src="js/config.js?v=7"></script>
  <script src="js/render.js?v=7"></script>
  <script src="js/main.js?v=7"></script>
</body>
</html>
